<!-- templates/dashboard.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - FarmTech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&display=swap');
    
    body {
        padding: 20px;
        background: #f8f9fa;
        font-family: 'Exo 2', sans-serif;
    }
    
    h1 {
        color: #0057A3; /* azul principal */
        font-weight: 700;
    }

    .sensor-card {
        margin-bottom: 20px;
    }
    
    .card-title {
        font-size: 1.2rem;
        color: #0057A3;
        font-weight: 600;
    }

    table {
        font-size: 0.9rem;
    }

    /* Botones personalizados */
    .btn-primary {
        background-color: #0057A3;
        border-color: #0057A3;
    }
    .btn-primary:hover, .btn-primary:focus {
        background-color: #004080;
        border-color: #004080;
    }

    .btn-success {
        background-color: #4CAF50;
        border-color: #4CAF50;
    }
    .btn-success:hover, .btn-success:focus {
        background-color: #388E3C;
        border-color: #388E3C;
    }

    /* Opcional: enlace dashboard */
    .dashboard-link {
        color: #0057A3;
        text-decoration: none;
        font-weight: 600;
    }
    .dashboard-link:hover {
        text-decoration: underline;
        color: #004080;
    }
</style>


</head>
<body>
    <div class="container">
        <h1 class="mb-4">🌿 Dashboard FarmTech</h1>

        <div class="row" id="dashboard-container">
            <!-- Tarjetas se llenarán con JS -->
        </div>

        <button class="btn btn-primary mt-3" onclick="cargarDatos()">🔄 Actualizar ahora</button>
        <a href="/" class="btn btn-success mt-3">📊 Ir al control</a>
    </div>

    <script>
        async function cargarDatos() {
            const res = await fetch("/datos");
            const data = await res.json();

            const contenedor = document.getElementById("dashboard-container");
            contenedor.innerHTML = "";

            const tarjetas = [
                { titulo: "Temperatura Aire (BMP390)", valor: `${parseFloat(data.sensor_bmp390.temperatura_a).toFixed(2)} °C` },
                { titulo: "Presión", valor: `${parseFloat(data.sensor_bmp390.presion_hPa).toFixed(2)} hPa` },
                { titulo: "Temperatura Aire (SCD30)", valor: `${parseFloat(data.sensor_scd30.temperatura_b).toFixed(2)} °C` },
                { titulo: "Humedad Aire", valor: `${parseFloat(data.sensor_scd30.humedad_pct).toFixed(2)} %` },
                { titulo: "CO₂", valor: `${parseFloat(data.sensor_scd30.co2_ppm).toFixed(2)} ppm` },
                { titulo: "Temperatura Suelo", valor: `${parseFloat(data.sensor_soil.temperatura).toFixed(2)} °C` },
                { titulo: "Humedad Suelo", valor: `${parseFloat(data.sensor_soil.humedad).toFixed(2)}` },
                { titulo: "Luz", valor: `${parseFloat(data.sensor_ltr390.lux).toFixed(2)} lux` },
                { titulo: "Índice UV", valor: `${parseFloat(data.sensor_ltr390.indice_uv).toFixed(2)}` },
                { titulo: "GPS", valor: `Lat: ${parseFloat(data.gps.latitud).toFixed(6)}, Lon: ${parseFloat(data.gps.longitud).toFixed(6)}` },
                {
                    titulo: "Clima NASA",
                    valor: (() => {
                        const clima = data.clima_satelital;
                        if (!clima || typeof clima !== 'object') return "Sin datos";

                        let tabla = '<table class="table table-sm table-bordered"><thead><tr><th>Parámetro</th><th>Valor</th></tr></thead><tbody>';
                        for (const [clave, valor] of Object.entries(clima)) {
                            tabla += `<tr><td>${clave}</td><td>${typeof valor === 'number' ? valor.toFixed(2) : valor}</td></tr>`;
                        }
                        tabla += '</tbody></table>';
                        return tabla;
                    })()
                }
            ];


            tarjetas.forEach(t => {
                const isClima = t.titulo === "Clima NASA";
                const isGPS = t.titulo === "GPS";

                let colClass = "";
                if (isClima) {
                    colClass = "col-md-12 sensor-card";
                } else if (isGPS) {
                    colClass = "col-md-4 sensor-card mx-auto";  // Centrada
                } else {
                    colClass = "col-md-4 sensor-card";
                }

                const card = `
                    <div class="${colClass}">
                        <div class="card shadow-sm">
                            <div class="card-body">
                                <h5 class="card-title">${t.titulo}</h5>
                                <p class="card-text">${t.valor}</p>
                            </div>
                        </div>
                    </div>`;
                contenedor.innerHTML += card;
            });


        }

        // Cargar al inicio y cada 10s
        cargarDatos();
        setInterval(cargarDatos, 10000);
    </script>
</body>
</html>
